appId: com.jonathanweidner.astra
productName: Astra
copyright: '© 2026 Jonathan Weidner — AGPL-3.0-or-later'
directories:
  buildResources: resources
  output: release
# Renderer ist ein gebündeltes SPA und main/preload brauchen zur Laufzeit nur
# `electron` – daher werden KEINE node_modules mitgepackt (sparte ~130 MB im
# app.asar, das macht den Kaltstart spürbar schneller).
files:
  - out/**/*
  - package.json
  - '!node_modules/**/*'
asar: true
asarUnpack:
  - '**/*.wasm'
  - '**/tesseract/**'
  - '**/ffmpeg/**'
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
fileAssociations:
  - ext: pdf
    name: PDF-Dokument
    description: PDF im Astra PDF-Editor öffnen
    role: Editor
    rank: Alternate
    mimeType: application/pdf
    icon: resources/icon.png
# macOS-Widgets (WidgetKit): Erst nach `npm run widgets` + Aktivierung von
# Code-Signing hier einzubinden. Vollständige Anleitung:
# src/native/widgets/README.md
#   mac.identity / hardenedRuntime: true / entitlements / entitlementsInherit
#   mac.extraFiles:
#     - from: resources/AstraWidgets.appex
#       to: PlugIns/AstraWidgets.appex
mac:
  category: public.app-category.productivity
  extendInfo:
    NSCalendarsUsageDescription: Astra zeigt im Studienplaner deine Vorlesungen und Klausuren aus dem Kalender an.
    NSCalendarsFullAccessUsageDescription: Astra zeigt im Studienplaner deine Vorlesungen und Klausuren aus dem Kalender an.
    NSCameraUsageDescription: Astra nutzt die Kamera, um QR- und Barcodes im Werkzeug „QR/Barcode" live zu scannen.
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
