appId: com.jonathanweidner.astra
productName: Astra
copyright: '© 2026 Jonathan Weidner — AGPL-3.0-or-later'
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.wasm'
  - '**/node_modules/mupdf/**'
  - '**/node_modules/tesseract.js-core/**'
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
fileAssociations:
  - ext: pdf
    name: PDF-Dokument
    description: PDF im Astra PDF-Editor öffnen
    role: Editor
    rank: Alternate
    mimeType: application/pdf
    icon: resources/icon.png
mac:
  category: public.app-category.productivity
  extendInfo:
    NSCalendarsUsageDescription: Astra zeigt im Studienplaner deine Vorlesungen und Klausuren aus dem Kalender an.
    NSCalendarsFullAccessUsageDescription: Astra zeigt im Studienplaner deine Vorlesungen und Klausuren aus dem Kalender an.
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
